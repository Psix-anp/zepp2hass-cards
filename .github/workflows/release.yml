name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e "const version = JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version; if (process.env.RELEASE_TAG !== 'v' + version) { throw new Error('Tag ' + process.env.RELEASE_TAG + ' must match package version v' + version); }"
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          awk -v version="${RELEASE_TAG#v}" '$0 ~ "^## \\[" version "\\]" { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md && test -s release-notes.md
      - name: Check release notes language
        run: |
          node -e "const notes = require('fs').readFileSync('release-notes.md', 'utf8'); if (!notes.trim() || /\p{Script=Cyrillic}/u.test(notes)) throw new Error('Release notes must be non-empty and written in English');"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Zepp2Hass Cards $GITHUB_REF_NAME" --notes-file release-notes.md
